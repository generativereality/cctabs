name: Release Tabby plugin

# Publishes `tabby-cctabs` to npm via OIDC trusted publishing.
#
# SEPARATE from release.yml on purpose: this is a different package with its own version line
# (`tabby-v*` tags, not `v*`) and a completely different build. Bundling them would mean every CLI
# release rebuilt Tabby, and every plugin release re-published the CLI.
#
# ⚠️ npm trusts a workflow by FILENAME. tabby-cctabs' Trusted Publisher names
# `generativereality/cctabs` + `release-tabby-plugin.yml`; renaming this file breaks publishing
# until npm is updated to match.
#
# ── Why the build is this involved ────────────────────────────────────────────────────────────
#
# The plugin compiles against Tabby's own webpack config, so it needs a full Tabby checkout with
# its dependencies installed. Three things about that are not obvious, and each one cost a failed
# build to find:
#
#  1. **Tabby must be at `related-repos/tabby` exactly.** `webpack.config.mjs` honours a
#     `TABBY_REPO` override, but `tsconfig.json` hardcodes `../../related-repos/tabby/...` in its
#     `paths`. So TABBY_REPO moves webpack's resolution and leaves TypeScript's behind, and the
#     build fails on `Cannot find module '@angular/core'` while webpack itself is perfectly happy.
#  2. **`npm run build:typings` in Tabby is required.** Its workspace packages point `types` at
#     `typings/index.d.ts`, which does not exist in a fresh clone. Without it the build fails on
#     `Cannot find module 'tabby-core'` — after the Angular errors are already gone, so it looks
#     like a different problem.
#  3. **The plugin installs with `--legacy-peer-deps`.** Its peer deps are all `"*"`, so npm
#     resolves each independently and picks conflicting Angular majors (seen: 20.1.8 vs 22.1.3)
#     and gives up with ERESOLVE. Those peers come from Tabby at runtime and are webpack
#     `externals`; the only dependency actually installed is `uuid`.
#
# Tabby is pinned. An unpinned upstream can break this build, or worse, silently link the plugin
# against a different Angular — with nothing to catch it, since the output is a bundle nobody
# reads.
on:
  push:
    tags:
      - "tabby-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Bump deliberately, and re-run the build when you do.
  TABBY_REF: v1.0.235

jobs:
  publish:
    runs-on: ubuntu-latest
    # Same human gate as the CLI. See release.yml for why this is an environment and not a step.
    environment: release
    steps:
      - uses: actions/checkout@v4

      # No registry-url: it makes setup-node write an .npmrc with a placeholder token, and npm
      # then publishes with that instead of doing the OIDC exchange. See release.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Check out Tabby at the pinned tag
        run: |
          git clone --depth 1 --branch "$TABBY_REF" https://github.com/Eugeny/tabby.git related-repos/tabby
          git -C related-repos/tabby describe --tags

      # ~800 MB and ~80s measured locally. Cached on the pinned ref, so only the first run after a
      # TABBY_REF bump pays for it.
      - name: Cache Tabby dependencies
        uses: actions/cache@v4
        with:
          path: |
            related-repos/tabby/node_modules
            related-repos/tabby/app/node_modules
          key: tabby-${{ env.TABBY_REF }}-${{ runner.os }}

      # fontmanager-redux compiles against fontconfig headers, which the runner image lacks.
      # Cheaper and more honest than pruning the dependency: the plugin build does not use it, but
      # it is reachable from `app`'s own install, and one apt package is less fragile than trying
      # to route around a transitive native module.
      - name: System headers for Tabby's native deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1-dev

      # Tabby's postinstall is `patch-package && install-deps.mjs && build-native.mjs`. The last
      # of those runs @electron/rebuild over every native module so Tabby can RUN as an Electron
      # app — which this job never does. It is pure cost, and on Linux it is the step that failed:
      #
      #   ../src/FontManagerLinux.cc:1:10: fatal error: fontconfig/fontconfig.h: No such file
      #   Error: node-gyp failed to rebuild '.../app/node_modules/fontmanager-redux'
      #
      # So run the first two by hand and skip the third. `--ignore-scripts` alone would be too
      # blunt: patch-package and install-deps are both required — the workspace packages are what
      # `build:typings` compiles, and without them the plugin build fails on `Cannot find module
      # 'tabby-core'`.
      #
      # Verified locally: this produces a byte-identical bundle to a full install (64,289 bytes).
      - name: Install Tabby (without the Electron native rebuild), and build its typings
        working-directory: related-repos/tabby
        run: |
          yarn install --ignore-scripts --network-timeout 600000
          npx patch-package
          node ./scripts/install-deps.mjs
          npm run build:typings

      - name: Install the plugin's own dependency
        working-directory: tabby-plugin
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify the tag, package.json and PLUGIN_VERSION all agree
        if: startsWith(github.ref, 'refs/tags/tabby-v')
        run: |
          TAG="${GITHUB_REF_NAME#tabby-v}"
          PKG=$(node -p "require('./tabby-plugin/package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }
          # ...and that PLUGIN_VERSION agrees, since that is what /api/health reports.
          # `npm test` asserts this pair too, but nothing in THIS workflow runs it, and a
          # plugin release is independent of the CLI's — so a bump made here would otherwise
          # publish before any test saw it. That is the path the drift arrived on twice.
          SRC=$(node -p "/const PLUGIN_VERSION = '([^']+)'/.exec(require('fs').readFileSync('tabby-plugin/src/server.ts','utf8'))[1]")
          echo "PLUGIN_VERSION=$SRC"
          [ "$SRC" = "$PKG" ] || { echo "::error::PLUGIN_VERSION $SRC != package.json $PKG"; exit 1; }

      - name: Build
        working-directory: tabby-plugin
        run: ../related-repos/tabby/node_modules/.bin/webpack --progress

      # The tarball ships `dist/` and nothing else, so an empty build would publish an empty
      # plugin and npm would accept it. Fail here instead.
      - name: Refuse to publish an empty bundle
        working-directory: tabby-plugin
        run: |
          test -s dist/index.js || { echo "::error::dist/index.js missing or empty"; exit 1; }
          echo "dist/index.js $(wc -c < dist/index.js) bytes"

      - name: Publish to npm
        working-directory: tabby-plugin
        run: npm publish --access public
